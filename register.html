
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar & Crumb | Register</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <header>
        <h1>Sugar &amp; Crumb</h1>
        <p>Join our sweet community!</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="media.html">Media &amp; Info</a>
        <a href="register.html">Register</a>
        <a href="services.html">Services</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <h2>Create Your Account</h2>
        <p>Register to explore our bakery treats.</p>

        <form action="#" method="get">

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname"
                placeholder="Enter your name" required
                minlength="3" maxlength="40">
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                required minlength="8">
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="birthday">Date of Birth:</label>
            <input type="date" id="birthday" name="birthday">
            <br><br>

            <label for="website">Website URL:</label>
            <input type="url" id="website" name="website">
            <br><br>

            <label for="favcolor">Favourite Color:</label>
            <input type="color" id="favcolor" name="favcolor" value="#a64b45">
            <br><br>

            <label for="quantity">Number of Guests:</label>
            <input type="number" id="quantity" name="quantity"
                min="1" max="20" value="1">
            <br><br>

            <label for="ordertime">Preferred Time:</label>
            <input type="time" id="ordertime" name="ordertime">
            <br><br>

            <label for="sweetness">Sweetness Level:</label>
            <input type="range" id="sweetness" name="sweetness"
                min="1" max="10" value="5">
            <br><br>

            <label for="message">Your Message:</label>
            <textarea id="message" name="message"
                rows="4" maxlength="200"
                placeholder="Tell us your favourite dessert"></textarea>
            <br><br>

            <label for="dessert">Favourite Dessert:</label>
            <select id="dessert" name="dessert" required>
                <option value="" selected disabled>Choose a dessert</option>
                <option value="cake">Chocolate Cake</option>
                <option value="cupcake">Cupcakes</option>
                <option value="cookies">Cookies</option>
            </select>
            <br><br>

            <label for="photo">Upload a Photo:</label>
            <input type="file" id="photo" name="photo" accept="image/*">
            <br><br>

            <p>Preferred Contact Method:</p>
            <input type="radio" id="contactemail" name="contactmethod"
                value="email" checked>
            <label for="contactemail">Email</label>

            <input type="radio" id="contactphone" name="contactmethod"
                value="phone">
            <label for="contactphone">Phone</label>
            <br><br>

            <input type="checkbox" id="offers" name="offers" checked>
            <label for="offers">Receive bakery offers</label>
            <br><br>

            <label for="country">Country:</label>
            <input type="text" id="country" value="Pakistan" readonly>
            <br><br>

            <label for="accounttype">Account Type:</label>
            <input type="text" id="accounttype" value="Customer" disabled>
            <br><br>

            <button type="submit">Register Now</button>
            <button type="reset">Reset Form</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Sugar &amp; Crumb Bakery</p>
    </footer>

</body>
</html>
